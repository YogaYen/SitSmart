global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # SitSmart Backend API Service
  - job_name: 'sitsmart-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000', 'localhost:5000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Prometheus Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
