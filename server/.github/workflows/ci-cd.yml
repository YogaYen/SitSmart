name: SitSmart CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Frontend Build & Quality Checks
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build React Client (Vite)
        working-directory: client
        run: npm run build

  # 2. Backend Unit & Health Checks
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

      - name: Verify Routes & Syntax
        working-directory: server
        run: |
          node -e "require('./routes/api'); console.log('API routes verified');"
          node -e "require('./models'); console.log('Mongoose models verified');"

  # 3. Docker Image Build Validation
  docker-build:
    needs: [frontend-build, backend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v2

      - name: Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: sitsmart-client:latest

      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: sitsmart-server:latest

  # 4. Kubernetes Helm Chart Lint & Validate
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.12.0'

      - name: Lint Helm Chart
        run: helm lint sitsmart-chart/

  # 5. Cloud Deploy (AWS EKS / Azure AKS)
  deploy-cloud:
    needs: [docker-build, helm-lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure Cloud Credentials & Kubeconfig
        run: echo "Configuring cloud credentials for AWS EKS / Azure AKS cluster"

      - name: Deploy via Helm Upgrade
        run: |
          echo "Executing: helm upgrade --install sitsmart ./sitsmart-chart --namespace sitsmart --create-namespace"
